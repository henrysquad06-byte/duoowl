<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flying Duolingo Owl</title>
  <style>
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* CSS Duolingo Owl MOC */
    .owl {
      width: 120px;
      height: 130px;
      background: #58cc02;
      border-radius: 50% 50% 40% 40%;
      position: relative;
    }

    /* Big Eyes */
    .owl::before, .owl::after {
      content: '';
      position: absolute;
      top: 25px;
      width: 45px;
      height: 45px;
      background: white;
      border-radius: 50%;
    }
    .owl::before { left: 12px; }
    .owl::after { right: 12px; }

    /* Pupils and Beak */
    .owl-face {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 2;
    }
    .owl-face::before, .owl-face::after {
      content: '';
      position: absolute;
      top: 38px;
      width: 14px;
      height: 14px;
      background: #4b4b4b;
      border-radius: 50%;
    }
    .owl-face::before { left: 28px; }
    .owl-face::after { right: 28px; }

    .beak {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 15px solid #ff9600;
    }
  </style>
</head>
<body>

  <!-- Custom Built Owl -->
  <div id="duo-owl" class="owl">
    <div class="owl-face">
      <div class="beak"></div>
    </div>
  </div>

  <script>
    const owl = document.getElementById("duo-owl");

    // Animation trigger
    owl.animate([
      { transform: 'translateY(0px)' },   
      { transform: 'translateY(-150px)' }, 
      { transform: 'translateY(0px)' }    
    ], {
      duration: 1200, 
      easing: 'ease-in-out', 
      iterations: Infinity // This makes it fly up and down forever
    });
  </script>

</body>
</html>
