<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duo Streak Watcher</title>
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-dark: #46a302;
            --bg-dark: #131f24;
            --card-dark: #202f36;
            --text-main: #f1f7fb;
            --text-sub: #afbbca;
            --border-color: #37464f;
            --fire-orange: #ff9600;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-dark);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5);
        }

        /* Top Bar Setup */
        .tracker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .user-badge { font-weight: 700; color: var(--text-sub); font-size: 0.95rem; }
        
        .streak-display {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 150, 0, 0.15);
            color: var(--fire-orange);
            padding: 6px 14px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 150, 0, 0.3);
        }

        /* Responsive Asset Image for the Flame */
        .flame-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* The Owl Character Container */
        .owl-stage {
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }
        
        /* Your customized Duolingo Artwork Image class */
        .owl-image {
            max-height: 100%;
            max-width: 180px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            animation: float 2s ease-in-out infinite; 
        }

        /* Speech Bubble */
        .speech-bubble {
            background: var(--text-main);
            color: #111;
            padding: 16px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 1.05rem;
            line-height: 1.4;
            margin-bottom: 25px;
            position: relative;
            box-shadow: 0 6px 0 #d0d7de;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: var(--text-main) transparent;
        }

        /* Control UI */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        input {
            flex: 1;
            background: #18262c;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: var(--duo-green); }
        
        button {
            background: var(--duo-green);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 12px 20px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--duo-green-dark);
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        .toggle-mode { color: var(--duo-green); font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: underline; margin-top: 10px; display: inline-block; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="tracker-header">
            <div class="user-badge" id="usernameDisplay">STREAK MASTER</div>
            <div class="streak-display">
                <!-- Using your updated asset link here -->
                <img src="assets/streak_fire.png" alt="Streak Flame" class="flame-icon">
                <span id="streakNum">31</span> DAYS
            </div>
        </div>

        <div class="speech-bubble" id="duoSpeech">
            31 DAYS! Look at you riding high! Your commitment pleases the cheered owl. Keep pushing!
        </div>

        <div class="owl-stage">
            <img src="assets/duolingo.png" alt="Cheered Duo Owl" class="owl-image" id="owlMascot">
        </div>

        <!-- Sync Mode View -->
        <div id="apiMode">
            <div class="input-group">
                <input type="text" id="duoUsername" placeholder="Duolingo Username">
                <button onclick="fetchStreak()">Sync Live</button>
            </div>
        </div>

        <!-- Backup Manual Override Mode -->
        <div id="manualMode" style="display: none;">
            <div class="input-group">
                <input type="number" id="manualStreak" placeholder="Enter Streak Manually" min="0" value="31">
                <button onclick="setManualStreak()">Update</button>
            </div>
        </div>

        <span class="toggle-mode" onclick="toggleMode()" id="modeLink">Switch to Manual Override</span>
    </div>

    <script>
        let currentMode = 'api';

        function toggleMode() {
            const apiDiv = document.getElementById('apiMode');
            const manualDiv = document.getElementById('manualMode');
            const link = document.getElementById('modeLink');
            
            if (currentMode === 'api') {
                apiDiv.style.display = 'none';
                manualDiv.style.display = 'block';
                link.innerText = "Switch to Live API Sync";
                currentMode = 'manual';
            } else {
                apiDiv.style.display = 'block';
                manualDiv.style.display = 'none';
                link.innerText = "Switch to Manual Override";
                currentMode = 'api';
            }
        }

        async function fetchStreak() {
            const username = document.getElementById('duoUsername').value.trim();
            if (!username) return alert("Please type your username first!");
            
            document.getElementById('duoSpeech').innerText = "Reaching into the Duolingo servers...";
            
            try {
                const url = `https://corsproxy.io{username}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data && data.users && data.users.length > 0) {
                    const user = data.users;
                    const activeStreak = user.streak || 0;
                    
                    document.getElementById('usernameDisplay').innerText = user.name.toUpperCase();
                    updateDuoDialogue(activeStreak);
                } else {
                    document.getElementById('duoSpeech').innerText = "I couldn't locate that user profile. Double-check spelling or try Manual Mode.";
                }
            } catch (err) {
                console.error(err);
                document.getElementById('duoSpeech').innerText = "GitHub's network proxy blocked the direct sync. Please click 'Manual Override' below to use the simulator!";
            }
        }

        function setManualStreak() {
            const val = parseInt(document.getElementById('manualStreak').value);
            if (isNaN(val) || val < 0) return alert("Enter a realistic number!");
            document.getElementById('usernameDisplay').innerText = "SIMULATOR USER";
            updateDuoDialogue(val);
        }

        function updateDuoDialogue(streak) {
            document.getElementById('streakNum').innerText = streak;
            const speech = document.getElementById('duoSpeech');

            if (streak === 0) {
                speech.innerText = "0 days? Zero?! Even my cheered expression cannot hide my deep disappointment. Go open the app.";
            } else if (streak > 0 && streak <= 10) {
                speech.innerText = `${streak} day(s) active. You have a long way to go, but you are making me proud.`;
            } else if (streak > 10 && streak <= 50) {
                speech.innerText = `${streak} DAYS! Look at you riding high! Your commitment completely cheers me up!`;
            } else {
                speech.innerText = `${streak} DAYS?! Absolute excellence. You are the ultimate language champion.`;
            }
        }
    </script>
</body>
</html>
